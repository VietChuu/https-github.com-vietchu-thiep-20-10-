<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde2e4"/>
      <stop offset="50%" stop-color="#fad2e1"/>
      <stop offset="100%" stop-color="#e2ece9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <!-- Sunset / Moon -->
  <circle cx="300" cy="230" r="115" fill="#fff1e6" opacity="0.9"/>
  <!-- Soft Hills -->
  <path d="M0,450 Q180,370 360,430 T600,410 L600,600 L0,600 Z" fill="#f9bec7" opacity="0.7"/>
  <path d="M0,490 Q240,420 450,480 T600,470 L600,600 L0,600 Z" fill="#ff8fa3" opacity="0.6"/>
  <!-- Two coffee cups / date table -->
  <g transform="translate(300, 360)">
    <ellipse cx="0" cy="60" rx="140" ry="26" fill="#fff0f3" stroke="#e5989b" stroke-width="3"/>
    <!-- Left Cup -->
    <g transform="translate(-55, 10)">
      <path d="M-28,0 L-22,42 C-20,50 20,50 22,42 L28,0 Z" fill="#ff758f"/>
      <path d="M26,8 C42,8 42,32 23,32" fill="none" stroke="#ff758f" stroke-width="5" stroke-linecap="round"/>
      <path d="M-8,-12 Q-14,-25 -4,-35" fill="none" stroke="#c9184a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M6,-15 Q0,-28 10,-38" fill="none" stroke="#c9184a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- Right Cup -->
    <g transform="translate(55, 10)">
      <path d="M-28,0 L-22,42 C-20,50 20,50 22,42 L28,0 Z" fill="#ffb3c6"/>
      <path d="M26,8 C42,8 42,32 23,32" fill="none" stroke="#ffb3c6" stroke-width="5" stroke-linecap="round"/>
      <path d="M-6,-12 Q-12,-25 -2,-35" fill="none" stroke="#c9184a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <path d="M8,-15 Q2,-28 12,-38" fill="none" stroke="#c9184a" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- Floating Heart Between Cups -->
    <path d="M0,-15 C-5,-20 -30,-38 -30,-56 C-30,-68 -20,-76 -10,-76 C-4,-76 -1,-72 0,-69 C1,-72 4,-76 10,-76 C20,-76 30,-68 30,-56 C30,-38 5,-20 0,-15 Z" fill="#ff4d6d"/>
  </g>
  <text x="300" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#800f2f" font-style="italic" opacity="0.85">Sweet Date Together</text>
</svg>
